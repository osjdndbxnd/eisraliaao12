<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مولّد صور مجاني (سلسلة 30 مزوّد)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  :root{
    --glass: rgba(255,255,255,0.12);
    --glass-2: rgba(255,255,255,0.18);
    --txt: #f7f7f7;
    --accent1:#ff8a00;
    --accent2:#e52e71;
    --ok:#23d5ab;
    --warn:#ffcc70;
    --err:#ff4d4f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--txt);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden;
    background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1f1c2c);
    background-size:400% 400%;animation:bg 16s ease infinite;
  }
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* زخات نجوم لطيفة */
  .stars{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.25}
  .stars::before,.stars::after{
    content:"";position:absolute;inset:-50% -50%;background:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent 55%),
    radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent 55%),
    radial-gradient(2px 2px at 40% 80%,#fff,transparent 55%),
    radial-gradient(1.5px 1.5px at 80% 20%,#fff,transparent 55%);
    animation: drift 80s linear infinite;
  }
  .stars::after{animation-duration:120s;opacity:.7}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(50%)}}

  .wrap{
    max-width:1000px;margin:auto;padding:32px;
    display:flex;flex-direction:column;gap:22px;position:relative;
  }

  header{
    text-align:center;padding:18px 16px;border-radius:24px;
    background:linear-gradient(135deg, var(--glass), rgba(255,255,255,0.08));
    backdrop-filter: blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.35);
  }
  header h1{
    margin:0;font-size:clamp(26px,4vw,36px);letter-spacing:.5px;
    background:linear-gradient(45deg,var(--warn),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation: glow 2.2s ease-in-out infinite alternate;
  }
  header p{margin:.5rem 0 0;color:#dcdcdc}
  @keyframes glow{from{text-shadow:0 0 8px #ffc;}to{text-shadow:0 0 18px #f0a,0 0 28px #ffc7}}

  .card{
    background:linear-gradient(135deg,var(--glass-2),rgba(255,255,255,0.1));
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;padding:20px 20px 24px;box-shadow:0 16px 40px rgba(0,0,0,.45);
  }

  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
  .col{flex:1 1 320px}

  textarea{
    width:100%;min-height:140px;border:none;border-radius:16px;padding:16px;font-size:1.05rem;
    color:#0f172a;background:#ffffff;box-shadow:0 8px 20px rgba(0,0,0,.25);resize:vertical;
    outline:none
  }
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .btn{
    border:none;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;
    color:#fff;background:linear-gradient(45deg,var(--accent1),var(--accent2));
    box-shadow:0 10px 22px rgba(0,0,0,.35);transition:transform .15s ease, filter .15s ease;
    display:inline-flex;align-items:center;gap:10px
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:linear-gradient(45deg,#64748b,#334155)}
  .btn.good{background:linear-gradient(45deg,#22c55e,#16a34a)}
  .btn.warn{background:linear-gradient(45deg,#f59e0b,#d97706)}
  .hint{font-size:.95rem;color:#e6e6e6;margin-top:6px;opacity:.85}

  .viewer{
    display:grid;place-items:center;min-height:420px;border-radius:18px;
    background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.2);overflow:hidden;
    position:relative
  }
  .viewer img{
    width:100%;max-width:720px;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.5);
    transform:scale(1);transition:transform .5s ease, opacity .3s ease
  }
  .viewer.loading::after{
    content:"";position:absolute;width:60px;height:60px;border-radius:50%;
    border:6px solid rgba(255,255,255,.25);border-top-color:var(--warn);animation:spin 1s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .status{
    margin-top:10px;font-size:.95rem;color:#e2e8f0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.9rem;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)
  }
  .note{opacity:.8}

  .toast{
    position:fixed;top:18px;inset-inline-end:18px;z-index:9999;
    background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.45);
    transform:translateY(-25px);opacity:0;transition:all .25s ease
  }
  .toast.show{transform:translateY(0);opacity:1}

  footer{opacity:.8;text-align:center;margin:8px auto 22px}
</style>
</head>

<body>
  <div class="stars"></div>
  <div class="wrap">
    <header class="card">
      <h1>محول النص إلى صورة — مجاني مجاني بـ كامل</h1>

    <section class="card">
      <div class="row">
        <div class="col">
          <label for="q" class="hint">الوصف</label>
          <textarea id="q" placeholder=""></textarea>
          <div class="controls">
            <button id="go" class="btn"><i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء صورة</button>
            <button id="save" class="btn good"><i class="fa-solid fa-download"></i> حفظ الصورة</button>
            <button id="newimg" class="btn secondary"><i class="fa-solid fa-shuffle"></i> جرّب اعادة صورة آخر</button>
            <button id="clear" class="btn warn"><i class="fa-solid fa-rotate-left"></i> مسح</button>
          </div>
          <div class="hint">احبك ♡.</div>
        </div>
        <div class="col">
          <div id="viewer" class="viewer">
            <img id="img" alt="الصورة الناتجة" style="display:none" referrerpolicy="no-referrer" crossorigin="anonymous"/>
          </div>
          <div class="status">
            <span class="badge"><i class="fa-solid fa-plug"></i> الموقع الحالي: <b id="providerName">—</b></span>
            <span class="badge"><i class="fa-solid fa-circle-nodes"></i> المحاولات: <b id="tries">0</b> / 30</span>
            <span class="note" id="note"></span>
          </div>
        </div>
      </div>
    </section>

    <footer>تم  انشاء موقع من برمج ياسر علي (Glassmorphism) ✨</footer>
  </div>

  <div id="toast" class="toast"></div>

<script>
/* ====== أدوات صغيرة ====== */
const el = id => document.getElementById(id);
const toast = (txt) => {
  const t = el('toast'); t.textContent = txt; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
};
const setLoading = (on) => {
  el('viewer').classList.toggle('loading', !!on);
  el('img').style.opacity = on ? .0 : 1;
};

/* ====== قائمة 30 مزود (بدون مفتاح) ======
   المبدأ:
   - بعضها يولد صور AI مجانية (Pollinations)
   - بعضها يجلب صور فوتو مجانية عبر كلمة مفتاحية (Unsplash Source, LoremFlickr)
   - بعضها عبر API مفتوحة (Wikipedia/Wikimedia, Openverse, NASA, MET, AIC)
   - لكل مزود دالة تعيد URL نهائي للصورة أو Promise يرجع URL
*/
const providers = [
  // 1-6 Pollinations AI (مولّد مجاني)
  { name: "Pollinaons (std)",    url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent(q)}?width=896&height=576&seed=${Date.now()%99999}` },
  { name: "Pollinations (photo)",  url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent('photo, high quality, ' + q)}?width=896&height=576&seed=${Math.random()}` },
  { name: "Pollinations (art)",    url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent('digital art, ' + q)}?width=896&height=576` },
  { name: "Pollinations (hdr)",    url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent('ultra-detailed, hdr, ' + q)}?width=896&height=576` },
  { name: "Pollinations (4:5)",    url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent(q)}?width=800&height=1000` },
  { name: "Pollinations (square)", url: q => `https://image.pollinations.ai/prompt/${encodeURIComponent(q)}?width=768&height=768` },

  // 7-10 Unsplash Source (صور حسب الكلمات) — أحياناً يحجب، لذلك كأحد الخيارات
  { name: "Unsplash (600x400)", url: q => `https://source.unsplash.com/600x400/?${encodeURIComponent(q)}` },
  { name: "Unsplash (800x600)", url: q => `https://source.unsplash.com/800x600/?${encodeURIComponent(q)}` },
  { name: "Unsplash (1200x800)", url: q => `https://source.unsplash.com/1200x800/?${encodeURIComponent(q)}` },
  { name: "Unsplash (portrait)", url: q => `https://source.unsplash.com/800x1000/?${encodeURIComponent(q)}` },

  // 11-14 LoremFlickr (صور حسب الكلمات)
  { name: "LoremFlickr (800x600)", url: q => `https://loremflickr.com/800/600/${encodeURIComponent(q)}?lock=${Math.floor(Math.random()*99999)}` },
  { name: "LoremFlickr (1024x768)", url: q => `https://loremflickr.com/1024/768/${encodeURIComponent(q)}?random=${Math.random()}` },
  { name: "LoremFlickr (square)", url: q => `https://loremflickr.com/800/800/${encodeURIComponent(q)}?random=${Math.random()}` },
  { name: "LoremFlickr (tall)", url: q => `https://loremflickr.com/700/1000/${encodeURIComponent(q)}?random=${Math.random()}` },

  // 15-18 Wikipedia/Wikimedia (نجلب صورة من مقالة ذات صلة)
  { name: "Wikipedia (pageimage)", url: q => wikiLeadImage(q) },
  { name: "Wikimedia (search img)", url: q => commonsImage(q) },
  { name: "Wikipedia (en backup)", url: q => wikiLeadImage(q, 'en') },
  { name: "Wikipedia (ar backup)", url: q => wikiLeadImage(q, 'ar') },

  // 19-21 Openverse (CC images)
  { name: "Openverse (best)", url: q => openverse(q, 'relevance') },
  { name: "Openverse (latest)", url: q => openverse(q, 'published') },
  { name: "Openverse (random)", url: q => openverse(q, 'random') },

  // 22-23 NASA Images (قد تناسب مفاهيم علمية/فضاء)
  { name: "NASA (search)", url: q => nasaImage(q) },
  { name: "NASA (backup earth)", url: q => nasaImage('earth ' + q) },

  // 24-25 MET Museum (فن مفتوح)
  { name: "MET (search art)", url: q => metImage(q) },
  { name: "MET (backup portrait)", url: q => metImage('portrait ' + q) },

  // 26-27 Art Institute of Chicago (AIC)
  { name: "AIC (search)", url: q => aicImage(q) },
  { name: "AIC (backup landscape)", url: q => aicImage('landscape ' + q) },

  // 28-30 بدائل عامة أخيرة
  { name: "RoboHash (نمط فني)", url: q => `https://robohash.org/${encodeURIComponent(q)}.png?size=800x600&set=set1` },
  { name: "RoboHash (وحوش)", url: q => `https://robohash.org/${encodeURIComponent(q)}.png?size=800x600&set=set2` },
  { name: "RoboHash (قطط/كرتون)", url: q => `https://robohash.org/${encodeURIComponent(q)}.png?size=800x600&set=set4` },
];

/* ====== دوال مزوّدات تعتمد على API عامة (دون مفتاح) ====== */
async function wikiLeadImage(q, lang='ar'){
  // نبحث عن صفحة، ثم نرجع صورة الغلاف (thumbnail) إن وُجدت
  const s = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&origin=*&format=json&prop=pageimages|pageterms&piprop=original|thumbnail&pithumbsize=1200&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1`);
  const j = await s.json();
  if(!j.query) throw new Error('no wiki result');
  const page = Object.values(j.query.pages)[0];
  const url = (page.original && page.original.source) || (page.thumbnail && page.thumbnail.source);
  if(!url) throw new Error('no wiki image');
  return url;
}

async function commonsImage(q){
  // بحث في ويكيميديا كومنز عن ملفات صور
  const s = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&origin=*&format=json&prop=imageinfo&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&iiprop=url`);
  const j = await s.json();
  if(!j.query) throw new Error('no commons result');
  const page = Object.values(j.query.pages)[0];
  const info = page.imageinfo && page.imageinfo[0];
  if(!info || !info.url) throw new Error('no commons image');
  return info.url;
}

async function openverse(q, sortBy='relevance'){
  const s = await fetch(`https://api.openverse.engineering/v1/images/?q=${encodeURIComponent(q)}&page_size=1&license_type=all&search_by=all&license=cc0,by,by-sa&extension=jpg&sort_by=${sortBy}`);
  const j = await s.json();
  if(!j.results || !j.results.length) throw new Error('no openverse');
  // نأخذ رابط الصورة المباشر
  const r = j.results[0];
  return r.url || r.thumbnail || r.foreign_landing_url;
}

async function nasaImage(q){
  const s = await fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(q)}&media_type=image`);
  const j = await s.json();
  const items = (j.collection && j.collection.items) || [];
  if(!items.length) throw new Error('no nasa');
  // نأخذ أول item ونجيب منه اللينك الأصلي
  const assets = await fetch(items[0].href);
  const files = await assets.json();
  const img = files.find(u => /\.jpg|\.jpeg|\.png$/i.test(u)) || files[0];
  if(!img) throw new Error('no nasa image');
  return img;
}

async function metImage(q){
  // نبحث IDs ثم تفاصيل كل ID حتى نجد صورة مفتوحة الوصول
  const idsRes = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/search?isOnView=true&q=${encodeURIComponent(q)}`);
  const idsJson = await idsRes.json();
  if(!idsJson.objectIDs || !idsJson.objectIDs.length) throw new Error('no met');
  for (const id of idsJson.objectIDs.slice(0,20)){
    const r = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`);
    const j = await r.json();
    if(j && j.primaryImageLarge) return j.primaryImageLarge;
  }
  throw new Error('no met image');
}

async function aicImage(q){
  const r = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(q)}&limit=1&fields=id,image_id`);
  const j = await r.json();
  const d = j.data && j.data[0];
  if(!d || !d.image_id) throw new Error('no aic');
  // قالب IIIF
  return `https://www.artic.edu/iiif/2/${d.image_id}/full/843,/0/default.jpg`;
}

/* ====== منطق التجريب المتسلسل ====== */
let providerIndex = 0;
let tries = 0;
let lastURL = null;

function updateStatus(name){
  el('providerName').textContent = name || '—';
  el('tries').textContent = tries.toString();
}

async function getURLFromProvider(p, query){
  try{
    const val = p.url(query);
    return (val instanceof Promise) ? await val : val;
  }catch(err){
    throw err;
  }
}

function loadImageWithCheck(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.referrerPolicy = 'no-referrer';
    const timer = setTimeout(()=>{ img.src=''; reject(new Error('timeout')); }, 12000);
    img.onload = ()=>{ clearTimeout(timer); resolve(url); };
    img.onerror = ()=>{ clearTimeout(timer); reject(new Error('img error')); };
    img.src = url + (url.includes('?') ? '&' : '?') + 'ts=' + Date.now(); // منع الكاش
  });
}

async function tryNext(query, fromShuffle=false){
  if(!query){ toast('اكتب وصف أولاً'); return; }
  if(!fromShuffle){ providerIndex = 0; tries = 0; }
  setLoading(true);
  el('note').textContent = '';
  for (let i = providerIndex; i < providers.length; i++){
    const p = providers[i];
    tries++; updateStatus(p.name);
    try{
      const url = await getURLFromProvider(p, query);
      await loadImageWithCheck(url);
      lastURL = url;
      providerIndex = i; // ثبتنا المزود الحالي
      showImage(url, p.name);
      setLoading(false);
      if (tries>1) toast(`تم بنجاح بعد ${tries} محاولة ✅`);
      return;
    }catch(e){
      // جرّب التالي
    }
  }
  setLoading(false);
  toast('لم تنجح أي مزودات حالياً. جرّب وصفاً أبسط أو أعد المحاولة 🔁');
  el('note').textContent = 'نصيحة: قلّل الكلمات أو غيّر اللغة (مثلاً جرّب إنجليزي).';
}

function showImage(url, providerName){
  const img = el('img');
  img.style.display = 'block';
  img.style.opacity = '0';
  img.onload = ()=>{ img.style.opacity = '1'; }
  img.src = url;
  el('providerName').textContent = providerName;
}

/* ====== حفظ فعلي (محاولة عبر blob، وإلا فتح تبويب) ====== */
async function saveImage(){
  if(!lastURL){ toast('لا توجد صورة للحفظ'); return; }
  try{
    const res = await fetch(lastURL, {mode:'cors', cache:'no-store'});
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `image_${Date.now()}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast('تم حفظ الصورة ✅');
  }catch(e){
    // بعض المزودين يمنعون blob/CORS — نفتح في تبويب للحفظ اليدوي
    window.open(lastURL, '_blank');
    toast('تم فتح الصورة في تبويب — احفظها يدوياً 💾');
  }
}

/* ====== أحداث الواجهة ====== */
el('go').addEventListener('click', ()=> tryNext(el('q').value.trim()));
el('newimg').addEventListener('click', ()=>{
  // جرّب المزوّد التالي مباشرةً
  if(providerIndex < providers.length - 1){
    providerIndex++;
  }else{
    providerIndex = 0;
  }
  tryNext(el('q').value.trim(), true);
});
el('clear').addEventListener('click', ()=>{
  el('q').value=''; el('img').style.display='none'; lastURL=null; tries=0; updateStatus('—'); el('note').textContent='';
});
el('save').addEventListener('click', saveImage);

// اختصار Enter
el('q').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); el('go').click(); }
});
</script>
</body>
</html>
